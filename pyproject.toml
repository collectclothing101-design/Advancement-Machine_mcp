[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advancement-machine"
version = "0.4.0"
description = "Universal MCP/Plugin/Skill engine — deterministic build, SBOM, supply-chain verified"
readme = "README.md"
authors = [{name = "EuroThrottle"}]
license = "MIT"
requires-python = ">=3.10"
keywords = ["mcp", "plugin", "skill", "advancement", "automation", "sbom", "supply-chain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "tomli>=2.0.0",
    "watchdog>=3.0",
    "rich>=13.0",
    "click>=8.1",
    "mcp>=1.0.0",
    "cyclonedx-python-lib>=3.0",
    "packageurl-python>=0.13",
    "websockets>=12.0",
    "numpy>=1.24",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "psutil>=5.9",
    "aiohttp>=3.8",
    "capstone>=5.0",
]
http = [
    "fastapi>=0.100.0",
    "uvicorn>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/eurothrottle/advancement-machine"
Repository = "https://github.com/eurothrottle/advancement-machine"
Documentation = "https://advancement-machine.readthedocs.io"

[project.scripts]
advancement = "advancement_machine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "SIM", "ARG", "B", "C4"]
ignore = ["E501", "W191"]

[tool.mypy]
strict = true
ignore_missing_imports = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
minversion = "7.0"
addopts = "-v --tb=short --cov=advancement_machine --cov-report=term-missing --no-header"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/.venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise AssertionError",
    "raise NotImplementedError",
]
